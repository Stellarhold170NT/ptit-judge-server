<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head('Lịch sử nộp bài - PTIT Judge')}"></head>
<body class="bg-dark text-light">
<nav th:replace="~{layout :: nav(${loggedIn}, ${displayName})}"></nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card card-glass">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold mb-0">
                            <i class="bi bi-clock-history me-2"></i>Lịch sử nộp bài
                        </h3>
                        <span class="text-muted" th:text="${studentCode}">Student</span>
                    </div>

                    <div th:if="${#lists.isEmpty(submissions)}" class="text-center py-5">
                        <div class="empty-icon mb-3">📋</div>
                        <h5 class="text-muted">Chưa có bài nộp nào</h5>
                        <p class="text-muted">Hãy bắt đầu làm bài tập để xem kết quả tại đây.</p>
                        <a href="/" class="btn btn-accent mt-2">
                            <i class="bi bi-grid-1x2-fill me-1"></i> Xem bài tập
                        </a>
                    </div>

                    <div th:unless="${#lists.isEmpty(submissions)}" class="table-responsive">
                        <table class="table table-dark table-hover align-middle">
                            <thead>
                                <tr class="border-accent">
                                    <th>#</th>
                                    <th>Bài tập</th>
                                    <th>Đáp án gửi</th>
                                    <th>Đáp án đúng</th>
                                    <th>Trạng thái</th>
                                    <th>Thời gian</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="sub, iter : ${submissions}">
                                    <td th:text="${iter.count}">1</td>
                                    <td>
                                        <a th:href="@{'/exercise/' + ${sub.qCode}}" class="text-accent text-decoration-none"
                                           th:text="${exerciseNames.get(sub.qCode)} ?: ${sub.qCode}">Bài tập</a>
                                    </td>
                                    <td>
                                        <code class="code-tag" th:text="${sub.answer}">answer</code>
                                    </td>
                                    <td>
                                        <code class="code-tag" th:text="${sub.correctAnswer} ?: '-'">correct</code>
                                    </td>
                                    <td>
                                        <span th:if="${sub.status == 'AC'}" class="badge bg-success">AC</span>
                                        <span th:if="${sub.status == 'WA'}" class="badge bg-danger">WA</span>
                                        <span th:if="${sub.status == 'RTE'}" class="badge bg-warning text-dark">RTE</span>
                                    </td>
                                    <td class="text-muted small"
                                        th:text="${#temporals.format(sub.timestamp, 'dd/MM/yyyy HH:mm')}">time</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
