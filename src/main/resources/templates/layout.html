<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">PTIT Judge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<nav th:fragment="nav(loggedIn, displayName)" class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-accent">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <span class="brand-icon">&lt;/&gt;</span> PTIT Judge
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="bi bi-grid-1x2-fill me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item" th:if="${loggedIn}">
                    <a class="nav-link" href="/submissions"><i class="bi bi-clock-history me-1"></i> Lịch sử nộp bài</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${loggedIn}">
                    <span class="nav-link text-success fw-semibold">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${displayName}">User</span>
                    </span>
                </li>
                <li class="nav-item" th:if="${loggedIn}">
                    <form method="post" action="/logout" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm ms-2">
                            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                        </button>
                    </form>
                </li>
                <li class="nav-item" th:unless="${loggedIn}">
                    <a class="btn btn-outline-light btn-sm me-2" href="/login">Đăng nhập</a>
                </li>
                <li class="nav-item" th:unless="${loggedIn}">
                    <a class="btn btn-accent btn-sm" href="/register">Đăng ký</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="footer mt-auto py-3 bg-dark text-center border-top border-accent">
    <div class="container">
        <span class="text-muted">PTIT Judge Server &mdash; Hệ thống chấm điểm luyện tập</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</html>
