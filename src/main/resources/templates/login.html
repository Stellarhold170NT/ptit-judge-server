<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head('Đăng nhập - PTIT Judge')}"></head>
<body class="bg-dark text-light">
<nav th:replace="~{layout :: nav(${loggedIn != null ? loggedIn : false}, ${displayName != null ? displayName : ''})}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-glass">
                <div class="card-body p-4">
                    <h2 class="text-center mb-1 fw-bold brand-text">Đăng nhập</h2>
                    <p class="text-center text-muted mb-4">Truy cập hệ thống chấm điểm PTIT</p>

                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${error}">Lỗi đăng nhập</span>
                    </div>

                    <form method="post" action="/login">
                        <div class="mb-3">
                            <label for="email" class="form-label text-muted">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-dark text-light border-secondary" id="email" name="email" placeholder="sinhvien@ptit.edu.vn" required/>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label text-muted">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" placeholder="••••••••" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted">Chưa có tài khoản?</span>
                        <a href="/register" class="text-accent ms-1">Đăng ký ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
